<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ebenaum - Personnage</title>
    <link href="print.css" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "jose": "https://cdnjs.cloudflare.com/ajax/libs/jose/5.9.6/index.js",
          "@bufbuild/protobuf": "https://cdn.skypack.dev/@bufbuild/protobuf",
          "@bufbuild/protobuf/": "https://cdn.skypack.dev/@bufbuild/protobuf/"
        }
      }
    </script>
    <script type="module" src="env.js"></script>
    <script type="module" src="app.js"></script>
  </head>

  <body class="d-none">
    <page>
      <h1 class="title"></h1>
      <h2 class="subtitle">
        <span class="subtitle__race"></span>,
        <span class="subtitle__vdv"></span> ; Groupe :
        <span class="subtitle__group"></span>
      </h2>

      <div class="trombi"></div>

      <div class="spacer-m"></div>

      <div class="section1">
        <div class="characteristics">
          <div class="characteristic corps">
            <div class="characteristic__level">
              <span class="characteristic__level__value"></span>
            </div>
            <div class="characteristic__label"></div>
            <div class="characteristic__description d-inline"></div>
          </div>

          <div class="characteristic savoir">
            <div class="characteristic__level">
              <span class="characteristic__level__value"></span>
            </div>
            <div class="characteristic__label"></div>
            <div class="characteristic__description d-inline"></div>
          </div>

          <div class="characteristic dexterite">
            <div class="characteristic__level">
              <span class="characteristic__level__value"></span>
            </div>
            <div class="characteristic__label"></div>
            <div class="characteristic__description d-inline"></div>
          </div>

          <div class="characteristic influence">
            <div class="characteristic__level">
              <span class="characteristic__level__value"></span>
            </div>
            <div class="characteristic__label"></div>
            <div class="characteristic__description d-inline"></div>
          </div>
        </div>

        <div>
          <div class="vll d-inline"></div>
          <div class="vl d-inline"></div>
        </div>

        <div>
          <div class="mentalCrisis"></div>
          <div class="handicaps d-none">
            <ul></ul>
          </div>
          <div class="inventory d-none">
            <h4>Inventaire</h4>
            <ul></ul>
          </div>
        </div>
      </div>

      <h2>Compétences & Dons</h2>
      <div class="skills"></div>
    </page>

    <div class="pagebreak"></div>

    <page>
      <div class="bg">
        <h2>Background</h2>
        <span></span>
      </div>

      <div class="bggroup d-none">
        <h2></h2>
        <span></span>
      </div>

      <div class="quests d-none">
        <h2>Quêtes</h2>
        <ul></ul>
      </div>

      <div class="death-rules"></div>
      <div class="magic-rules"></div>

      <div class="local-knowledge d-none">
        <h2></h2>
        <ul></ul>
      </div>
    </page>
  </body>
</html>
